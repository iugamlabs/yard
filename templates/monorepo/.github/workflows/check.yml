name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      YARD_NUGET_SOURCE: ${{ vars.YARD_NUGET_SOURCE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm install -g pnpm@12.11.2
      - name: Restore the private Yard distribution
        run: |
          test -n "$YARD_NUGET_SOURCE" || { echo 'Set YARD_NUGET_SOURCE to your private feed or downloaded local package directory.'; exit 1; }
          dotnet tool install Iugam.Yard.Cli --version 0.1.0 --tool-path .yard/bootstrap --add-source "$YARD_NUGET_SOURCE"
          .yard/bootstrap/yard install
      - run: dotnet yard check
